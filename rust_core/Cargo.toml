[package]
name = "apex_rust_core"
version = "2.0.0"
edition = "2021"
authors = ["Apex Overdrive Team"]
description = "Universal Cross-Platform (Linux + Windows) OS Kernel Low-Latency & High-FPS Game Accelerator in Rust"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_Memory",
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_Media",
    "Win32_Security"
] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
